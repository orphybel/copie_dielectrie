name: Build exe

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installer les dépendances
        run: python -m pip install --upgrade pyinstaller pywin32

      - name: Compiler
        run: python -m PyInstaller --noconfirm --onefile --windowed --name copie_dielectrie_gui copie_dielectrie_gui.py

      - name: Publier l'exe (onglet Actions)
        uses: actions/upload-artifact@v6
        with:
          name: copie_dielectrie_gui
          path: dist/copie_dielectrie_gui.exe

      - name: Joindre l'exe à la release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/copie_dielectrie_gui.exe
